<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0E8F86"/>
      <stop offset="1" stop-color="#0B5D6B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- cột tăng trưởng -->
  <rect x="232" y="610" width="130" height="190" rx="34" fill="url(#bar)"/>
  <rect x="447" y="485" width="130" height="315" rx="34" fill="url(#bar)"/>
  <rect x="662" y="360" width="130" height="440" rx="34" fill="url(#bar)"/>
  <!-- đường đi lên + mũi tên -->
  <path d="M220 520 C 360 500, 470 420, 560 330 S 690 230, 748 205"
        fill="none" stroke="#FFD166" stroke-width="44" stroke-linecap="round"/>
  <path d="M676 138 L 836 160 L 792 316 Z" fill="#FFD166" stroke="#FFD166" stroke-width="24" stroke-linejoin="round"/>
</svg>
