# Đặt vào /etc/httpd/conf.d/tiktok.conf rồi chạy certbot --apache để bật HTTPS
<VirtualHost *:80>
    ServerName 135-125-75-93.sslip.io
    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
