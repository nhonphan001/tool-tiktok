services:
  tiktok-manager:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"  # chỉ nghe nội bộ, đi qua reverse proxy
    volumes:
      - ./data:/app/data:z          # SQLite
      - ./exports:/app/exports:z    # file Markdown cho NotebookLM
      - ./secrets:/app/secrets:ro,z # service-account.json
    restart: unless-stopped
