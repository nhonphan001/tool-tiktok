services:
  tiktok-manager:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:z          # SQLite
      - ./exports:/app/exports:z    # file Markdown cho NotebookLM
      - ./secrets:/app/secrets:ro,z # service-account.json
    restart: unless-stopped
